# Deploys the site to GitHub Pages on every push to main.
#
# You do NOT need this workflow to go live — the site is already plain static
# files, so "Settings → Pages → Deploy from a branch" works with zero config.
# Use this instead if you'd rather have a deploy log and an explicit pipeline.
#
# To enable: repo Settings → Pages → Source → "GitHub Actions".

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The repo root IS the site — there is no build output directory.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
