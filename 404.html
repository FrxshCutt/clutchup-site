<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — ClutchUp</title>
<meta name="description" content="That page doesn't exist. Head back to ClutchUp, or contact support.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050506">

<!-- This page is served at ARBITRARY paths, so it carries its own styles
     rather than linking a stylesheet by a path that may not resolve.
     The links below are rooted at "/" and are rewritten to the correct base
     by `npm run set-url` if you deploy to a project subpath. -->
<style>
  :root {
    --purple: #7b26dc; --purple-bright: #9b4df2;
    --bg: #050506; --ink: #fcfbfb; --ink-soft: #a2a5b0; --ink-faint: #6a6d78;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 40px 22px;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.6; text-align: center;
    overflow-x: hidden;
  }
  .glow {
    position: fixed; inset: -30% -20% auto -20%; height: 90%; z-index: -1;
    pointer-events: none; filter: blur(40px);
  }
  .glow span { position: absolute; display: block; border-radius: 50%; opacity: 0.45; }
  .glow span:nth-child(1) {
    top: 0; left: 12%; width: 44vw; height: 44vw;
    background: radial-gradient(circle, rgba(123,38,220,0.75), transparent 66%);
    animation: drift 20s var(--ease-out) infinite alternate;
  }
  .glow span:nth-child(2) {
    top: 18%; right: 8%; width: 36vw; height: 36vw;
    background: radial-gradient(circle, rgba(155,77,242,0.55), transparent 68%);
    animation: drift2 26s var(--ease-out) infinite alternate;
  }
  @keyframes drift  { from { transform: translate3d(0,0,0) scale(1); }   to { transform: translate3d(8%,6%,0) scale(1.15); } }
  @keyframes drift2 { from { transform: translate3d(0,0,0) scale(1.1); } to { transform: translate3d(-9%,8%,0) scale(0.94); } }

  .wrap { width: 100%; max-width: 620px; }
  .code {
    margin: 0 0 10px;
    font-size: clamp(5rem, 18vw, 9rem); font-weight: 750;
    letter-spacing: -0.06em; line-height: 1;
    background: linear-gradient(104deg, #fff 8%, var(--purple-bright) 52%, #d9bcff 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { margin: 0; font-size: clamp(1.9rem, 5.5vw, 2.7rem); font-weight: 700; letter-spacing: -0.03em; }
  .lede { margin: 18px 0 0; color: var(--ink-soft); font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; gap: 13px; justify-content: center; margin-top: 30px; }
  a { color: inherit; text-decoration: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 26px; border: 1px solid transparent; border-radius: 999px;
    font-size: 16px; font-weight: 650;
    transition: transform 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out), background-color 0.3s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn--primary {
    background: linear-gradient(180deg, var(--purple-bright), var(--purple)); color: #fff;
    box-shadow: 0 10px 30px -10px rgba(155,77,242,0.45), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .btn--ghost { background: rgba(255,255,255,0.045); border-color: rgba(255,255,255,0.14); }
  .btn--ghost:hover { background: rgba(255,255,255,0.09); border-color: rgba(155,77,242,0.5); }
  .links { margin-top: 34px; color: var(--ink-faint); font-size: 14px; }
  .links a { color: var(--ink-faint); }
  .links a:hover { color: var(--purple-bright); }

  .in { opacity: 0; transform: translateY(22px); animation: in 0.9s var(--ease-out) forwards; }
  .in:nth-child(1) { animation-delay: 0.05s; }
  .in:nth-child(2) { animation-delay: 0.15s; }
  .in:nth-child(3) { animation-delay: 0.25s; }
  .in:nth-child(4) { animation-delay: 0.35s; }
  .in:nth-child(5) { animation-delay: 0.45s; }
  @keyframes in { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.16s !important;
    }
    .in { opacity: 1; transform: none; animation: none !important; }
    .glow span { animation: none !important; }
    .btn:hover { transform: none !important; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><span></span><span></span></div>
<main class="wrap">
  <p class="code in">404</p>
  <h1 class="in">Wrong turn.</h1>
  <p class="lede in">That page doesn't exist. Let's get you back on route.</p>
  <div class="row in">
    <a class="btn btn--primary" href="/">Back to home</a>
    <a class="btn btn--ghost" href="/support/">Support</a>
  </div>
  <p class="links in">
    <a href="/how-it-works/">How it works</a> ·
    <a href="/pricing/">Pricing</a> ·
    <a href="/privacy/">Privacy</a> ·
    <a href="/terms/">Terms</a>
  </p>
</main>
</body>
</html>
